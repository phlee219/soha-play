<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fff6e9">
<title>소하 놀이터</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="sessionBar"><i></i></div>

<section id="home" class="screen on">
  <h1>소하 놀이터</h1>
  <div class="tiles" id="tiles"></div>
  <button id="gear" class="hold corner">⚙️<small>부모 설정 (꾹)</small></button>
</section>

<section id="words" class="screen">
  <header class="bar"><button class="hold homeBtn">🏠<small>꾹</small></button><h2></h2><span></span></header>
  <div id="grid" class="grid"></div>
  <p class="tip"></p>
</section>

<section id="peek" class="screen">
  <header class="bar"><button class="hold homeBtn">🏠<small>꾹</small></button><h2></h2><span></span></header>
  <div class="peekArea" id="peekArea">
    <div id="stage" class="stage door">
      <div class="animal" id="peekAnimal"></div>
      <div class="cover door-cover"><div class="leaf l"></div><div class="leaf r"></div></div>
      <div class="cover bush-cover"><i></i><i></i><i></i><i></i><i></i></div>
    </div>
    <div id="peekCap" class="cap"><b></b><span></span></div>
  </div>
  <p class="tip"></p>
</section>

<section id="quiz" class="screen">
  <header class="bar"><button class="hold homeBtn">🏠<small>꾹</small></button><h2></h2><button id="quizAsk" class="ask">🔊</button></header>
  <div class="quizBody">
    <div id="quizTop" class="quizTop" hidden></div>
    <div id="choices" class="choices"></div>
  </div>
  <p class="tip"></p>
</section>

<section id="count" class="screen">
  <header class="bar"><button class="hold homeBtn">🏠<small>꾹</small></button><h2></h2><span></span></header>
  <div id="countArea" class="countArea"></div>
  <p class="tip"></p>
</section>

<section id="balloon" class="screen">
  <header class="bar"><button class="hold homeBtn">🏠<small>꾹</small></button><h2></h2><span></span></header>
  <div id="sky" class="sky"></div>
  <p class="tip"></p>
</section>

<section id="move" class="screen">
  <header class="bar"><button class="hold homeBtn">🏠<small>꾹</small></button><h2></h2><span></span></header>
  <div id="moveArea" class="moveArea"><div class="moveIcon" id="moveIcon"></div><div class="moveText" id="moveText"></div><div class="moveNext">다 했으면 화면을 눌러요 ▶</div></div>
  <p class="tip"></p>
</section>

<section id="end" class="screen">
  <div class="endBox"><div class="big">🌙</div><h2>오늘은 여기까지!</h2><p>이제 엄마 아빠랑 놀자</p></div>
  <button id="resume" class="hold">부모: 꾹 눌러서 계속하기</button>
</section>

<div id="big" class="overlay"><div class="bigCard"><div id="bigVis"></div><div id="bigName"></div></div></div>

<div id="parent" class="overlay modal">
  <div class="panel">
    <h2>부모 설정</h2>

    <section>
      <h3 id="fTitle">새 카드</h3>
      <div class="form">
        <div id="fPreview" class="preview">사진 없음</div>
        <div class="fields">
          <label class="btn">📷 사진 고르기<input type="file" id="fPhoto" accept="image/*" hidden></label>
          <input id="fLabel" placeholder="이름 (예: 엄마, 할머니, 우리 멍멍이)" maxlength="20" autocomplete="off">
          <div class="row">
            <button id="fRec" class="btn">⏺ 이름 녹음</button>
            <button id="fPlay" class="btn">▶ 들어보기</button>
            <button id="fDelRec" class="btn">녹음 지우기</button>
          </div>
          <p class="hint">이름을 또박또박, 밝게 한 번 말해 주세요 (최대 5초). 녹음한 카드는 "어디 있지?", "똑같은 거" 놀이에도 나와요.</p>
          <div class="row">
            <button id="fSave" class="btn primary">저장</button>
            <button id="fNew" class="btn">새로 쓰기</button>
          </div>
          <p id="fMsg" class="msg"></p>
        </div>
      </div>
    </section>

    <section>
      <h3>우리 가족 카드</h3>
      <div id="myList"></div>
    </section>

    <section>
      <h3>놀이 설정</h3>
      <label class="set">한 번에 놀 시간
        <select id="sMin">
          <option value="5">5분</option><option value="10">10분</option><option value="15">15분</option>
          <option value="20">20분</option><option value="0">제한 없음</option>
        </select>
      </label>
      <label class="set">고르기 놀이 보기 수
        <select id="sChoices"><option value="2">2개 (쉬움)</option><option value="3">3개</option><option value="4">4개</option></select>
      </label>
      <label class="set">"하나 둘 셋" 최대 수
        <select id="sCountMax"><option value="3">3까지</option><option value="5">5까지</option><option value="10">10까지</option></select>
      </label>
      <label class="set"><input type="checkbox" id="sTips"> 화면 아래 부모 도움말 보여주기</label>
      <h4>홈 화면에 보일 놀이</h4>
      <div id="sGames" class="checks"></div>
      <h4>쓸 낱말 묶음</h4>
      <div id="sCats" class="checks"></div>
    </section>

    <section>
      <h3>최근 7일 사용 시간</h3>
      <div id="usage" class="usage"></div>
      <p class="hint">만 2세 전후에는 화면을 짧게, 부모와 함께 보는 것이 권장돼요.</p>
    </section>

    <button id="pClose" class="btn primary wide">닫기</button>
  </div>
</div>

<script src="clips.js"></script>
<script src="app.js"></script>
</body>
</html>
